<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v2.1 帳號測試頁</title>
<!-- 只給本機測試 v2.1 帳號系統用；v2.2 的正式網站（Next.js）做好後刪掉 -->
<style>
  :root { --bg:#0B1220; --card:#131C2E; --line:#22304A; --text:#E5E7EB; --muted:#94A3B8; --accent:#2DD4BF; --warn:#F59E0B; --bad:#F87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 4px; } h2 { font-size:16px; margin:0 0 10px; color:var(--accent); }
  h3 { font-size:14px; margin:14px 0 6px; color:var(--muted); }
  .note { color:var(--muted); font-size:13px; margin:0 0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:12px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  input, select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; min-width:0; flex:1 1 160px; }
  button { background:var(--accent); color:#06201C; border:0; border-radius:6px; padding:7px 12px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.danger { background:transparent; color:var(--bad); border:1px solid var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .coach { color:var(--warn); border-color:var(--warn); }
  .code { font-family:ui-monospace, monospace; font-size:16px; letter-spacing:1px; color:var(--warn); }
  .sub { color:var(--muted); font-size:12px; }
  #log { position:sticky; bottom:0; background:#0E1626; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
         font-size:13px; min-height:36px; white-space:pre-wrap; }
  #log.err { color:var(--bad); } #log.ok { color:var(--accent); }
  .wrap { overflow-x:auto; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Football Analysis Potato · v2.1 帳號測試頁</h1>
  <p class="note">只在你自己的電腦上用（後端只讓 127.0.0.1 打開這一頁）。正式網站是 v2.2。</p>

  <section id="login-box">
    <h2>登入</h2>
    <div class="row"><button id="google">用 Google 登入</button></div>
    <h3>或用 Email</h3>
    <div class="row">
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="密碼（至少 6 個字）" autocomplete="current-password">
    </div>
    <div class="row"><button id="signin">登入</button><button class="ghost" id="signup">註冊新帳號</button></div>
  </section>

  <div id="app" hidden>
    <section>
      <h2>我</h2>
      <div class="row"><span id="who"></span><span id="admin-tag" class="tag coach" hidden>系統管理者</span>
        <button class="ghost" id="signout" style="margin-left:auto">登出</button></div>
      <div class="row"><input id="display-name" placeholder="顯示名稱" maxlength="40"><button class="ghost" id="save-name">儲存名稱</button></div>
    </section>

    <section>
      <h2>加入球隊</h2>
      <div class="row"><input id="team-code" placeholder="Team ID，例如 K7Q4-MZP9" maxlength="40"><button id="join">加入</button></div>
    </section>

    <section>
      <h2>我的球隊</h2>
      <div class="row"><select id="team-select"></select></div>
      <div id="team-detail"></div>
    </section>

    <section id="coach-box" hidden>
      <h2>教練專區</h2>
      <div class="row">Team ID：<span class="code" id="team-code-show"></span>
        <button class="danger" id="reset-code">重設 Team ID</button></div>
      <h3>教練碼</h3>
      <div class="row"><input id="valid-days" type="number" min="1" max="30" value="7" style="flex:0 0 90px">天有效
        <button id="new-coach-code">產生教練碼</button></div>
      <div id="new-code-show"></div>
      <div class="wrap"><table id="codes"></table></div>
      <h3>成員</h3>
      <div class="wrap"><table id="members"></table></div>
    </section>

    <section id="admin-box" hidden>
      <h2>系統管理者：建立隊伍</h2>
      <div class="row">
        <input id="new-team-name" placeholder="隊伍名稱">
        <input id="new-team-season" placeholder="賽季，例如 2026-27">
        <input id="new-team-league" placeholder="聯賽上的隊名（可空白）">
      </div>
      <div class="row"><button id="create-team">建立</button></div>
      <div id="created-team"></div>
    </section>
  </div>

  <div id="log"></div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (t) => (t ? new Date(t).toLocaleString("zh-TW", { hour12: false }) : "—");
function log(msg, kind = "") { const el = $("log"); el.textContent = msg; el.className = kind; }

const cfg = await (await fetch("/dev/config")).json();
if (!cfg.supabase_url || !cfg.publishable_key) {
  log(".env 缺少 SUPABASE_URL 或 SUPABASE_PUBLISHABLE_KEY", "err");
  throw new Error("missing config");
}
const sb = createClient(cfg.supabase_url, cfg.publishable_key);
let me = null;

async function api(method, path, body) {
  const { data } = await sb.auth.getSession();
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${data.session?.access_token ?? ""}` },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = json.detail;
    const msg = typeof d === "string" ? d : (d?.message ?? JSON.stringify(json));
    const extra = d?.attempts_left !== undefined ? `（還剩 ${d.attempts_left} 次）` : d?.until ? `（解鎖時間 ${when(d.until)}）` : "";
    throw new Error(msg + extra);
  }
  return json;
}
// 按鈕：執行時先停用，結果寫在下方
function on(id, fn) {
  $(id).addEventListener("click", async (e) => {
    e.target.disabled = true;
    try { await fn(e); } catch (err) { log(err.message, "err"); } finally { e.target.disabled = false; }
  });
}

// ---------- 登入 ----------
on("google", async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + "/dev" } });
  if (error) throw error;
});
on("signin", async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (error) throw error;
});
on("signup", async () => {
  const { data, error } = await sb.auth.signUp({ email: $("email").value, password: $("password").value,
                                                 options: { emailRedirectTo: location.origin + "/dev" } });
  if (error) throw error;
  log(data.session ? "註冊完成，已登入" : "註冊完成：請到信箱點確認連結，再回來登入", "ok");
});
on("signout", async () => { await sb.auth.signOut(); });

sb.auth.onAuthStateChange((_event, session) => {
  $("login-box").hidden = !!session;
  $("app").hidden = !session;
  if (session) { $("who").textContent = session.user.email ?? ""; refresh(); }
});

// ---------- 我 ----------
async function refresh(keepTeam) {
  me = await api("GET", "/me");
  $("display-name").value = me.display_name;
  $("admin-tag").hidden = $("admin-box").hidden = !me.is_admin;
  const sel = $("team-select"), prev = keepTeam ?? sel.value;
  sel.innerHTML = me.teams.length ? me.teams.map((t) =>
    `<option value="${t.id}">${esc(t.name)}${t.season ? " · " + esc(t.season) : ""}（${t.role === "coach" ? "教練" : "球員"}）</option>`).join("")
    : `<option value="">還沒加入任何球隊</option>`;
  if (me.teams.some((t) => t.id === prev)) sel.value = prev;
  await showTeam();
}
on("save-name", async () => { await api("PATCH", "/me", { display_name: $("display-name").value }); log("已儲存名稱", "ok"); });
on("join", async () => {
  const r = await api("POST", "/teams/join", { code: $("team-code").value });
  log(`${r.message}：${r.name}`, "ok"); $("team-code").value = ""; await refresh(r.team_id);
});
$("team-select").addEventListener("change", () => showTeam().catch((e) => log(e.message, "err")));

// ---------- 選到的球隊 ----------
async function showTeam() {
  const t = me.teams.find((x) => x.id === $("team-select").value);
  const box = $("team-detail");
  $("coach-box").hidden = !(t && (t.role === "coach" || me.is_admin));
  if (!t) { box.innerHTML = ""; return; }

  let link;
  if (t.player_id) link = `名單上的你：<b>${esc(t.player_name)}</b>`;
  else if (t.claim_player_id || t.claim_new_name)
    link = `認領申請中：<b>${esc(t.claim_player_name || t.claim_new_name)}</b>${t.claim_new_name ? "（新名字）" : ""}，等教練確認`;
  else link = "還沒連到名單上的球員";

  box.innerHTML = `
    <div class="row">身分：<span class="tag ${t.role === "coach" ? "coach" : ""}">${t.role === "coach" ? "教練" : "球員"}</span></div>
    <div class="row">${link}</div>
    <div id="claim-area"></div>
    ${t.role === "coach" ? "" : `
      <h3>升級成教練</h3>
      ${t.coach_code_banned ? `<div class="row" style="color:var(--bad)">教練碼輸錯太多次，已被封鎖；請找教練解除</div>` : `
      <div class="row"><input id="coach-code" placeholder="教練碼，例如 ABCDE-FGHJK" maxlength="40"><button id="redeem">兌換</button></div>`}`}
    <div class="row" style="margin-top:12px"><button class="danger" id="leave">離開這一隊</button></div>`;

  if (!t.player_id && !t.claim_player_id && !t.claim_new_name) {
    const players = await api("GET", `/teams/${t.id}/claimable`);
    $("claim-area").innerHTML = `
      <h3>認領名單上的自己</h3>
      <div class="row"><select id="claim-player">${players.map((p) =>
        `<option value="${p.id}">${esc(p.name)}${p.nickname ? "　" + esc(p.nickname) : ""}</option>`).join("")}</select>
        <button id="claim">認領</button></div>
      <div class="row"><input id="claim-new" placeholder="名單上沒有我：填我的名字" maxlength="40"><button class="ghost" id="claim-new-btn">申請新增</button></div>`;
    if (!players.length) $("claim-player").innerHTML = `<option value="">名單上的人都被認領了</option>`;
    on("claim", async () => { await api("POST", `/teams/${t.id}/claim`, { player_id: $("claim-player").value || null });
                             log("已送出，等教練確認", "ok"); await refresh(t.id); });
    on("claim-new-btn", async () => { await api("POST", `/teams/${t.id}/claim`, { new_name: $("claim-new").value });
                                     log("已送出，等教練確認", "ok"); await refresh(t.id); });
  }
  if ($("redeem")) on("redeem", async () => {
    await api("POST", `/teams/${t.id}/coach-code/redeem`, { code: $("coach-code").value });
    log("你現在是這一隊的教練了", "ok"); await refresh(t.id);
  });
  on("leave", async () => {
    if (!confirm(`確定離開「${t.name}」？`)) return;
    await api("POST", `/teams/${t.id}/leave`); log("已離開", "ok"); await refresh();
  });
  if (!$("coach-box").hidden) await showCoach(t);
}

// ---------- 教練專區 ----------
async function showCoach(t) {
  $("team-code-show").textContent = t.code ?? "（加入這一隊後才看得到）";
  $("new-code-show").innerHTML = "";
  const [codes, members] = await Promise.all([api("GET", `/teams/${t.id}/coach-codes`), api("GET", `/teams/${t.id}/members`)]);

  $("codes").innerHTML = `<tr><th>最後 2 碼</th><th>到期</th><th>用過</th><th></th></tr>` + (codes.map((c) => `
    <tr><td class="code">…${esc(c.hint)}</td><td>${when(c.expires_at)}${c.revoked_at ? "（已作廢）" : !c.active ? "（已過期）" : ""}</td>
      <td>${c.uses} 次</td><td>${c.active ? `<button class="danger" data-revoke="${c.id}">作廢</button>` : ""}</td></tr>`).join("")
    || `<tr><td colspan="4" class="sub">還沒有教練碼</td></tr>`);

  $("members").innerHTML = `<tr><th>帳號</th><th>身分</th><th>名單上的球員</th><th></th></tr>` + members.map((m) => {
    const claim = m.claim_player_id || m.claim_new_name;
    const isMe = m.user_id === me.user_id;
    const actions = [
      claim ? `<button data-approve="${m.user_id}">確認</button><button class="ghost" data-reject="${m.user_id}">拒絕</button>` : "",
      m.coach_code_banned_at ? `<button class="ghost" data-unban="${m.user_id}">解除封鎖</button>` : "",
      !isMe && (m.role === "player" || me.is_admin) ? `<button class="danger" data-remove="${m.user_id}">移出</button>` : "",
      !isMe && m.role === "coach" && me.is_admin ? `<button class="danger" data-demote="${m.user_id}">取消教練</button>` : "",
    ].join(" ");
    return `<tr><td>${esc(m.display_name || "（沒有名稱）")}${isMe ? " <span class='sub'>你</span>" : ""}<div class="sub">加入 ${when(m.joined_at)}</div></td>
      <td><span class="tag ${m.role === "coach" ? "coach" : ""}">${m.role === "coach" ? "教練" : "球員"}</span>
        ${m.coach_code_banned_at ? `<div class="sub" style="color:var(--bad)">教練碼封鎖中</div>` : ""}</td>
      <td>${m.player_name ? esc(m.player_name) : "—"}${claim ? `<div class="sub">申請：${esc(m.claim_player_name || m.claim_new_name)}${m.claim_new_name ? "（新名字）" : ""}</div>` : ""}</td>
      <td>${actions}</td></tr>`;
  }).join("");
}

on("reset-code", async () => {
  const t = me.teams.find((x) => x.id === $("team-select").value);
  if (!confirm("重設後舊的 Team ID 立刻不能再加入（已經加入的人不受影響）。確定？")) return;
  const r = await api("POST", `/teams/${t.id}/code/reset`); log(`新的 Team ID：${r.code}`, "ok"); await refresh(t.id);
});
on("new-coach-code", async () => {
  const id = $("team-select").value;
  const r = await api("POST", `/teams/${id}/coach-codes`, { valid_days: Number($("valid-days").value) });
  await refresh(id);
  $("new-code-show").innerHTML = `<div class="row">新的教練碼：<span class="code">${esc(r.code)}</span>
    <span class="sub">只會顯示這一次，到期：${when(r.expires_at)}</span></div>`;
});
// 表格裡的按鈕
$("coach-box").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b || !b.dataset) return;
  const id = $("team-select").value, d = b.dataset;
  try {
    b.disabled = true;
    if (d.revoke) await api("DELETE", `/coach-codes/${d.revoke}`);
    else if (d.approve) await api("POST", `/teams/${id}/members/${d.approve}/claim`, { approve: true });
    else if (d.reject) await api("POST", `/teams/${id}/members/${d.reject}/claim`, { approve: false });
    else if (d.unban) await api("POST", `/teams/${id}/members/${d.unban}/unban`);
    else if (d.remove) { if (!confirm("確定把這個人移出球隊？")) return; await api("DELETE", `/teams/${id}/members/${d.remove}`); }
    else if (d.demote) await api("POST", `/admin/teams/${id}/members/${d.demote}/demote`);
    else return;
    log("完成", "ok"); await refresh(id);
  } catch (err) { log(err.message, "err"); } finally { b.disabled = false; }
});

// ---------- 系統管理者 ----------
on("create-team", async () => {
  const r = await api("POST", "/admin/teams", { name: $("new-team-name").value,
    season: $("new-team-season").value || null, league_name: $("new-team-league").value || null });
  $("created-team").innerHTML = `<div class="row">Team ID：<span class="code">${esc(r.code)}</span></div>
    <div class="row">第一組教練碼：<span class="code">${esc(r.coach_code)}</span><span class="sub">只顯示這一次，到期：${when(r.coach_code_expires_at)}</span></div>
    <p class="sub">你不會自動加入這一隊；要加入的話，用上面的 Team ID 加入。</p>`;
  log("已建立隊伍", "ok");
});
</script>
</body>
</html>
