# ============================================================
# 陣型：組隊頁用。要新增陣型就照格式加一段 [[formations]]。
#   code = 畫面上顯示的位置名稱（同一個陣型裡不能重複）
#   role = 用哪個位置的適合度來排人（要和 settings.toml 的 [positions.X] 一樣）
#   x, y = 在球場上的座標：球場長 105、寬 68，進攻方向朝右；y 大 = 左邊路
# ============================================================

